<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SAGE UI Fixes 2.4.0 — action bar preview</title>
  <link rel="stylesheet" href="https://sage.staratlas.com/assets/index-BjTVBnk0.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; min-height: 100vh; background: #0a0e1a; }
    body { display: grid; place-items: end center; padding: 40px 16px 48px; }
    #sa-action-bar { --panel-accent: rgb(255 190 77 / 90%); position: relative; left: auto; bottom: auto;
      transform: none; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-family: var(--font-family-display, Orbitron, sans-serif); }
    #sa-action-bar .sa-bar-grip { padding: 2px 14px; opacity: .35; color: color-mix(in srgb, var(--panel-accent) 80%, white);
      font: 600 9px Orbitron, sans-serif; letter-spacing: .28em; }
    #sa-action-bar .sa-acts { position: relative; display: flex; flex-wrap: nowrap; align-items: stretch; gap: 8px; padding: 8px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--panel-accent) 4%, transparent), color-mix(in srgb, var(--panel-accent) 1.5%, transparent));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--panel-accent) 18%, transparent), inset 0 -1px color-mix(in srgb, var(--panel-accent) 12%, transparent), 0 5px 16px #00000024; }
    #sa-action-bar .sa-acts:before, #sa-action-bar .sa-acts:after { position: absolute; width: .38rem; height: .38rem;
      pointer-events: none; background: color-mix(in srgb, var(--panel-accent) 58%, white); content: ""; opacity: .72; }
    #sa-action-bar .sa-acts:before { top: 0; left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); }
    #sa-action-bar .sa-acts:after { right: 0; bottom: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
    #sa-action-bar .sa-acts > button { box-sizing: border-box; position: relative; flex: 0 0 auto;
      width: 4.35rem !important; min-width: 4.35rem !important; max-width: 4.35rem !important;
      min-height: 4.35rem !important; height: 4.35rem !important; padding: .32rem .16rem .26rem !important; overflow: hidden;
      background: linear-gradient(165deg, color-mix(in srgb, var(--panel-accent) 58%, rgb(47 40 18 / 96%)),
        color-mix(in srgb, var(--panel-accent) 36%, rgb(22 18 10 / 96%))) !important;
      color: #fff6d8 !important; border-color: color-mix(in srgb, var(--panel-accent) 62%, white) !important; }
    #sa-action-bar .sa-acts > button [class*=ActionButtonInner] { display: flex !important; flex-direction: column !important;
      align-items: center !important; justify-content: center !important; gap: .22rem !important; width: 100% !important; }
    #sa-action-bar .sa-acts > button [class*=ActionIcon],
    #sa-action-bar .sa-acts > button > span > span:first-child { width: 1.55rem !important; height: 1.55rem !important; }
    #sa-action-bar .sa-acts > button svg { display: block; width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; }
    #sa-action-bar .sa-acts > button [class*=ActionLabel] { font-size: .42rem !important; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #sa-action-bar .sa-acts > button [class*=SubLabel] { font-size: .46rem !important; font-weight: 700; opacity: .85; }
    #sa-action-bar .sa-acts > button.sa-dim { opacity: .42; }
    #sa-action-bar .sa-acts > button[data-act=destruct] { margin-left: 1.6rem; --panel-accent: rgb(255 73 96 / 90%); }
    #sa-action-bar .sa-slots { display: flex; gap: 6px; padding: 4px 8px 6px; background: rgb(255 255 255 / 4%);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 8%); }
    #sa-action-bar .sa-slots > button { box-sizing: border-box; width: 3.15rem; height: 2.35rem; background: rgb(255 255 255 / 6%);
      border: 1px solid rgb(255 255 255 / 10%); color: rgb(227 235 241 / 72%); font: 700 8px Orbitron, sans-serif; }
    #sa-action-bar .sa-slots > button.sa-slot-on { border-color: color-mix(in srgb, var(--panel-accent) 55%, transparent);
      color: color-mix(in srgb, var(--panel-accent) 80%, white); background: rgb(255 190 77 / 10%); }
    #sa-action-bar .sa-slots > button.sa-slot-sel { box-shadow: inset 0 0 0 1px var(--panel-accent); }
    .note { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); color: #94a3b8;
      font: 600 11px Orbitron, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  </style>
</head>
<body>
  <p class="note">2.4.0 preview · live 0.0.371 CSS · stock tile classes</p>
  <div id="sa-action-bar">
    <div class="sa-bar-grip">⋮⋮</div>
    <div class="sa-acts">
      <!-- filled by script -->
    </div>
    <div class="sa-slots">
      <button class="sa-slot-on sa-slot-sel" type="button">ALPHA</button>
      <button class="sa-slot-on" type="button">BETA</button>
      <button type="button">+</button>
      <button type="button">+</button>
      <button type="button">+</button>
      <button type="button">+</button>
      <button type="button">+</button>
      <button type="button">+</button>
    </div>
  </div>
  <script>
    const ICO = {
      dock: '<svg viewBox="0 0 32 32"><path d="M8 26 H24"/><path d="M10 26 V14 H22 V26"/><path d="M16 4 V12"/><path d="M12 9 L16 13 L20 9"/></svg>',
      warp: '<svg viewBox="0 0 32 32"><path d="M16 4 L20 12 L16 10 L12 12 Z"/><path d="M8 16 L16 14 L24 16 L16 28 Z"/></svg>',
      subwarp: '<svg viewBox="0 0 32 32"><path d="M6 16 H22"/><path d="M18 10 L26 16 L18 22"/></svg>',
      gate: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/><path d="M6 16 H26"/><path d="M16 6 C11 12 11 20 16 26 C21 20 21 12 16 6"/></svg>',
      scan: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="4"/><circle cx="16" cy="16" r="9"/><path d="M16 2 V6 M16 26 V30 M2 16 H6 M26 16 H30"/></svg>',
      attack: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="8"/><path d="M16 4 V10 M16 22 V28 M4 16 H10 M22 16 H28"/><circle cx="16" cy="16" r="2"/></svg>',
      repair: '<svg viewBox="0 0 32 32"><path d="M20 6 L26 12 L14 24 L8 24 L8 18 Z"/><path d="M12 20 L20 12"/></svg>',
      mine: '<svg viewBox="0 0 32 32"><path d="M8 26 L20 14"/><path d="M14 8 C20 6 26 10 26 16"/><path d="M14 8 L20 14"/></svg>',
      stop: '<svg viewBox="0 0 32 32"><rect x="8" y="8" width="16" height="16" rx="1"/></svg>',
      stims: '<svg viewBox="0 0 32 32"><path d="M18 6 L26 14"/><path d="M22 10 L10 22 L6 26 L10 26 L22 14"/><path d="M14 18 L18 22"/></svg>',
      loot: '<svg viewBox="0 0 32 32"><path d="M6 14 H26 V26 H6 Z"/><path d="M11 14 V10 H21 V14"/></svg>',
      destruct: '<svg viewBox="0 0 32 32"><path d="M16 6 L28 26 H4 Z"/><path d="M16 14 V20"/><path d="M16 23 V24"/></svg>',
    };
    const acts = [
      ["dock","DOCK","D"],["warp","WARP","W"],["subwarp","SUB","S"],["gate","GATE","T"],
      ["scan","SCAN","C"],["attack","ATK","A"],["repair","FIX","R"],["mine","MINE","I"],
      ["stop","STOP","X"],["stims","STIM","V"],["loot","LOOT",""],["destruct","KILL",""],
    ];
    const root = document.querySelector(".sa-acts");
    const cls = {
      btn: "_statusActionButton_nsg6t_336 _fleetActionButton_1040r_21",
      inner: "_statusActionButtonInner_nsg6t_361 _fleetActionButtonInner_1040r_33",
      ico: "_statusActionIcon_nsg6t_418",
      text: "_statusActionText_nsg6t_368 _fleetActionButtonText_1040r_39",
      label: "_statusActionLabel_nsg6t_401",
      sub: "_statusActionSubLabel_nsg6t_409 _fleetActionButtonSubLabel_1040r_46",
    };
    for (const [id, lab, hk] of acts) {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.act = id;
      b.className = cls.btn;
      if (id === "stims" || id === "loot") b.classList.add("sa-dim");
      if (id === "destruct") b.setAttribute("data-action-tone", "attack");
      b.innerHTML = `<span class="${cls.inner}"><span class="${cls.ico}">${ICO[id]}</span><span class="${cls.text}"><span class="${cls.label}">${lab}</span><span class="${cls.sub}">${hk}</span></span></span>`;
      root.appendChild(b);
    }
  </script>
</body>
</html>
